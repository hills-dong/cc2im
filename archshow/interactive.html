<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc2im — Interactive Architecture Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --bg-card: #18181b;
  --bg-code: #1e1e22;
  --border: #27272a;
  --border-hover: #3f3f46;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;
  --cyan: #4cc9f0;
  --cyan-dim: #4cc9f020;
  --green: #34d399;
  --yellow: #fbbf24;
  --red: #f87171;
  --purple: #a78bfa;
  --orange: #fb923c;
  --pink: #f472b6;
  --blue: #5865F2;
  --lark-blue: #2D60F5;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  width: 100vw; height: 100vh;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ── Controls bar ── */
#controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(9,9,11,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; height: 44px;
}
#controls h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.5px; white-space: nowrap; }
#controls h1 span { color: var(--cyan); }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); }
.ctrl-btn {
  font-size: 12px; padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-muted); cursor: pointer; font-family: var(--font-mono);
  transition: all 0.15s; white-space: nowrap;
}
.ctrl-btn:hover { border-color: var(--border-hover); color: var(--text); }
.ctrl-btn.active { border-color: var(--yellow); color: var(--yellow); background: rgba(251,191,36,0.08); }
#zoom-label { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); min-width: 48px; text-align: center; }
.ctrl-shortcuts { margin-left: auto; font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.ctrl-shortcuts kbd {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px;
  padding: 1px 4px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
}

/* ── Viewport ── */
#viewport {
  position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
  overflow: hidden; cursor: grab;
}
#viewport.dragging { cursor: grabbing; }

#canvas {
  position: absolute; transform-origin: 0 0;
  width: 5200px; height: 4600px;
}

/* ── SVG connections overlay ── */
#connections {
  position: absolute; top: 0; left: 0;
  width: 5200px; height: 4600px;
  pointer-events: none; z-index: 1;
}

/* ── Nodes ── */
.node {
  position: absolute; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 10px;
  overflow: visible; z-index: 2;
  transition: box-shadow 0.2s, opacity 0.3s, filter 0.3s, border-color 0.3s;
}
.node:hover { box-shadow: 0 0 24px rgba(76,201,240,0.06); }
.node-head {
  padding: 10px 14px 8px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border);
}
.node-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.node-title { font-size: 14px; font-weight: 700; }
.node-badge {
  font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px;
  background: var(--cyan-dim); color: var(--cyan); font-family: var(--font-mono);
  margin-left: auto;
}
.node-body { padding: 10px 14px 14px; }
.left-accent { border-left: 3px solid; }

/* ── Content styles ── */
.section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-dim); margin: 8px 0 4px;
}
.section-label:first-child { margin-top: 0; }

pre.code-block {
  background: var(--bg-code); border: 1px solid var(--border); border-radius: 5px;
  padding: 8px 10px; overflow-x: auto; font-family: var(--font-mono);
  font-size: 10.5px; line-height: 1.65; color: var(--text-muted); margin: 4px 0;
  user-select: text;
}
.kw { color: var(--purple); } .tp { color: var(--cyan); }
.str { color: var(--green); } .cm { color: var(--text-dim); }
.fn { color: var(--yellow); } .num { color: var(--orange); }
.prop { color: var(--pink); }

.info-table { width: 100%; border-collapse: collapse; font-size: 10.5px; margin: 4px 0; }
.info-table th {
  text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border);
  color: var(--text-dim); font-weight: 500; font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.info-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); color: var(--text-muted); }
.info-table tr:last-child td { border-bottom: none; }
.info-table code {
  background: var(--bg-code); padding: 1px 4px; border-radius: 3px;
  font-size: 10px; color: var(--cyan); font-family: var(--font-mono);
}

.tag {
  display: inline-block; font-size: 9px; padding: 1px 5px;
  border-radius: 3px; font-weight: 500; font-family: var(--font-mono);
}
.tag-cyan { background: var(--cyan-dim); color: var(--cyan); }
.tag-green { background: #34d39920; color: var(--green); }
.tag-yellow { background: #fbbf2420; color: var(--yellow); }
.tag-purple { background: #a78bfa20; color: var(--purple); }
.tag-orange { background: #fb923c20; color: var(--orange); }
.tag-pink { background: #f472b620; color: var(--pink); }
.tag-red { background: #f8717120; color: var(--red); }

.flow-step { display: flex; gap: 6px; padding: 3px 0; align-items: flex-start; }
.flow-num {
  width: 18px; height: 18px; border-radius: 4px;
  background: var(--cyan-dim); color: var(--cyan);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; flex-shrink: 0;
}
.flow-text { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
.flow-text strong { color: var(--text); }
.desc-text { font-size: 11px; color: var(--text-dim); margin: 3px 0; line-height: 1.5; }
.separator { height: 1px; background: var(--border); margin: 6px 0; }

.state-row { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0; align-items: center; }
.state-pill {
  font-size: 10px; padding: 2px 7px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-mono);
}
.state-pill.s-active { border-color: var(--cyan); color: var(--cyan); }
.state-pill.s-green { border-color: var(--green); color: var(--green); }
.state-pill.s-red { border-color: var(--red); color: var(--red); }
.state-pill.s-yellow { border-color: var(--yellow); color: var(--yellow); }
.arrow-label { font-size: 9px; color: var(--text-dim); }

/* ── fn-anchor styles ── */
.fn-anchor {
  cursor: pointer;
  padding: 1px 3px;
  border-radius: 3px;
  transition: all 0.2s;
  position: relative;
}
.fn-anchor:hover {
  background: rgba(251, 191, 36, 0.15);
}
.fn-anchor.highlighted {
  background: rgba(251, 191, 36, 0.2);
  box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
  color: #fbbf24;
}
.fn-anchor.chain-active {
  animation: fnPulse 1.5s ease-in-out infinite;
}
@keyframes fnPulse {
  0%, 100% { box-shadow: 0 0 4px rgba(251, 191, 36, 0.2); }
  50% { box-shadow: 0 0 12px rgba(251, 191, 36, 0.5); }
}

/* ── Chain dimming ── */
.node.dimmed { opacity: 0.15; filter: grayscale(0.8); }
.node.chain-node { opacity: 1; filter: none; border-color: rgba(251, 191, 36, 0.4); }

/* ── Entry point panel ── */
#entry-panel {
  position: fixed; top: 56px; right: 16px; z-index: 1001;
  background: rgba(24,24,27,0.95); border: 1px solid var(--border);
  border-radius: 10px; width: 380px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  font-family: var(--font-mono);
  overflow: hidden;
}
#entry-panel-header {
  padding: 10px 14px 8px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  cursor: move;
}
#entry-panel-header .title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--yellow);
}
#entry-panel-header .toggle-btn {
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); cursor: pointer; font-size: 11px;
  padding: 2px 6px; font-family: var(--font-mono);
  transition: all 0.15s;
}
#entry-panel-header .toggle-btn:hover { color: var(--text); border-color: var(--border-hover); }
#entry-panel-body { padding: 6px 0; }
#entry-panel-body.collapsed { display: none; }
.entry-item {
  padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.15s; font-size: 10.5px; color: var(--text-muted);
}
.entry-item:hover { background: rgba(251,191,36,0.06); color: var(--text); }
.entry-item.active { background: rgba(251,191,36,0.1); color: var(--yellow); }
.entry-dot {
  width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--yellow);
  flex-shrink: 0; transition: all 0.15s;
}
.entry-item.active .entry-dot { background: var(--yellow); }
.entry-name { font-weight: 600; color: var(--text); min-width: 120px; }
.entry-item.active .entry-name { color: var(--yellow); }
.entry-path { color: var(--text-dim); font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Speed control ── */
#speed-control {
  padding: 6px 14px 8px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; color: var(--text-dim);
}
#speed-control label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.speed-btn {
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-muted); cursor: pointer; font-size: 10px;
  padding: 2px 8px; font-family: var(--font-mono);
  transition: all 0.15s;
}
.speed-btn:hover { color: var(--text); border-color: var(--border-hover); }
.speed-btn.active { border-color: var(--yellow); color: var(--yellow); background: rgba(251,191,36,0.08); }

/* ── Mini-map ── */
#minimap {
  position: fixed; bottom: 16px; right: 16px; z-index: 1000;
  width: 200px; height: 180px;
  background: rgba(24,24,27,0.92); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
}
#minimap-canvas {
  width: 100%; height: 100%;
}
#minimap-viewport {
  position: absolute; border: 1.5px solid var(--cyan);
  background: rgba(76,201,240,0.08); pointer-events: none;
}

/* ── Legend ── */
#legend {
  position: fixed; bottom: 16px; left: 16px; z-index: 1000;
  background: rgba(24,24,27,0.92); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 10px;
}
#legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: var(--text-muted); }
#legend .line-sample { width: 24px; height: 0; border-top: 2px; display: inline-block; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Controls ── -->
<div id="controls">
  <h1><span>cc2im</span> Architecture</h1>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="zoomBy(0.15)">+</button>
  <span id="zoom-label">100%</span>
  <button class="ctrl-btn" onclick="zoomBy(-0.15)">-</button>
  <button class="ctrl-btn" onclick="resetView()">Reset</button>
  <button class="ctrl-btn" onclick="fitToScreen()">Fit</button>
  <div class="ctrl-sep"></div>
  <span class="ctrl-shortcuts">
    <kbd>Scroll</kbd> zoom &nbsp; <kbd>Drag</kbd> pan &nbsp; <kbd>+/-</kbd> zoom &nbsp; <kbd>0</kbd> reset &nbsp; <kbd>Arrows</kbd> pan &nbsp; <kbd>Esc</kbd> clear chain
  </span>
</div>

<!-- ── Viewport ── -->
<div id="viewport">
  <div id="canvas">
    <svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- ── Entry Point Panel ── -->
<div id="entry-panel">
  <div id="entry-panel-header">
    <span class="title">Entry Points (click to trace)</span>
    <button class="toggle-btn" onclick="toggleEntryPanel()">_</button>
  </div>
  <div id="entry-panel-body"></div>
  <div id="speed-control">
    <label>Speed:</label>
    <button class="speed-btn" data-speed="0.5" onclick="setSpeed(0.5, this)">0.5x</button>
    <button class="speed-btn active" data-speed="1" onclick="setSpeed(1, this)">1x</button>
    <button class="speed-btn" data-speed="2" onclick="setSpeed(2, this)">2x</button>
  </div>
</div>

<!-- ── Mini-map ── -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-viewport"></div>
</div>

<!-- ── Legend ── -->
<div id="legend">
  <div style="font-weight:600;color:var(--text);margin-bottom:4px;">Connection Lines</div>
  <div class="row"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#4cc9f0" stroke-width="1.5"/></svg> Message flow (cyan)</div>
  <div class="row"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="4,3"/></svg> Store ops (dim)</div>
  <div class="row"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#a78bfa" stroke-width="1.5"/></svg> API flow (purple)</div>
  <div class="row"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="6,3"/></svg> Async / return (orange)</div>
  <div class="row"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#34d399" stroke-width="1.2"/></svg> WebSocket protocol (green)</div>
  <div class="row" style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#fbbf24" stroke-width="2.5"/></svg> Active chain (yellow)</div>
</div>

<script>
// ============================================================
// NODE DEFINITIONS — positions and content
// ============================================================

// Helper: wrap a code element text with fn-anchor
function fa(nodeId, funcName, displayText) {
  return `<span class="fn-anchor" data-fn="${nodeId}:${funcName}">${displayText}</span>`;
}

const NODES = [
  // ── Column 1: Clients (x: 60) ──
  {
    id: 'discord', x: 60, y: 60, w: 420, color: '#5865F2',
    title: 'Discord Client', badge: 'discord.js v14', dot: '#5865F2',
    html: `
      <div class="section-label">DiscordAdapter</div>
      <table class="info-table">
        <tr><td>SDK</td><td><code>discord.js</code> v14</td></tr>
        <tr><td>Connection</td><td>Bot Gateway (WebSocket)</td></tr>
        <tr><td>Channels</td><td>Creates <code>cc2im-{project}</code> text channel per project</td></tr>
        <tr><td>Threads</td><td>Discord thread from first message</td></tr>
        <tr><td>Max length</td><td>2,000 chars</td></tr>
        <tr><td>Extras</td><td>Slash commands, reactions, file upload</td></tr>
      </table>
      <div class="separator"></div>
      <div class="section-label">Key Methods</div>
      <table class="info-table">
        <tr><th>Method</th><th>Purpose</th></tr>
        <tr><td><code>${fa('discord','onMessage','onMessage(handler)')}</code></td><td>Register incoming message callback</td></tr>
        <tr><td><code>${fa('discord','setupProject','setupProject(name)')}</code></td><td>Create/find channel, register route</td></tr>
        <tr><td><code>${fa('discord','createThread','createThread(channelId, name)')}</code></td><td>Start Discord thread</td></tr>
        <tr><td><code>${fa('discord','sendMessage','sendMessage()')}</code></td><td>Post to channel/thread</td></tr>
        <tr><td><code>${fa('discord','editMessage','editMessage()')}</code></td><td>Update streaming content</td></tr>
        <tr><td><code>${fa('discord','uploadFile','uploadFile()')}</code></td><td>Attach images/files</td></tr>
        <tr><td><code>${fa('discord','addReaction','addReaction()')}</code></td><td>Add emoji reactions</td></tr>
      </table>`
  },
  {
    id: 'lark', x: 60, y: 520, w: 420, color: '#2D60F5',
    title: 'Lark Client', badge: 'node-sdk', dot: '#2D60F5',
    html: `
      <div class="section-label">LarkAdapter</div>
      <table class="info-table">
        <tr><td>SDK</td><td><code>@larksuiteoapi/node-sdk</code></td></tr>
        <tr><td>Connection</td><td>Lark WebSocket client</td></tr>
        <tr><td>Channels</td><td>Creates group chats per project</td></tr>
        <tr><td>Threads</td><td>Lark message threads (reply chains)</td></tr>
        <tr><td>Max length</td><td>30,000 chars</td></tr>
        <tr><td>Extras</td><td>Owner init (<code>/im-init</code>), member management</td></tr>
      </table>
      <div class="separator"></div>
      <div class="section-label">Key Methods</div>
      <table class="info-table">
        <tr><th>Method</th><th>Purpose</th></tr>
        <tr><td><code>${fa('lark','onMessage','onMessage(handler)')}</code></td><td>Register incoming message callback</td></tr>
        <tr><td><code>${fa('lark','setupProject','setupProject(name)')}</code></td><td>Create/find group chat</td></tr>
        <tr><td><code>${fa('lark','sendMessage','sendMessage()')}</code></td><td>Post via Lark API</td></tr>
        <tr><td><code>${fa('lark','editMessage','editMessage()')}</code></td><td>Update message content</td></tr>
        <tr><td><code>${fa('lark','uploadFile','uploadFile()')}</code></td><td>Upload via Lark file API</td></tr>
      </table>`
  },
  {
    id: 'webui', x: 60, y: 960, w: 420, color: '#4cc9f0',
    title: 'Web UI', badge: 'SvelteKit 5 + shadcn', dot: '#4cc9f0',
    html: `
      <div class="section-label">Routes</div>
      <table class="info-table">
        <tr><td><code>/</code></td><td>Redirect to /chat</td></tr>
        <tr><td><code>/chat</code></td><td>Project list</td></tr>
        <tr><td><code>/chat/[project]</code></td><td>Session list</td></tr>
        <tr><td><code>/chat/[project]/[session]</code></td><td>Chat conversation</td></tr>
        <tr><td><code>/stats</code></td><td>Token usage dashboard</td></tr>
        <tr><td><code>/config</code></td><td>Configuration editor</td></tr>
      </table>
      <div class="separator"></div>
      <div class="section-label">Stores</div>
      <table class="info-table">
        <tr><td><code>connection.ts</code></td><td>WS lifecycle, auto-reconnect (0/1/2/4s then 30s cap), message queue, event dispatch</td></tr>
        <tr><td><code>chat.ts</code></td><td>Session state (Map&lt;sessKey, Session&gt;), message arrays, thread key mapping</td></tr>
      </table>
      <div class="separator"></div>
      <div class="section-label">Key Actions</div>
      <table class="info-table">
        <tr><td><code>${fa('webui','chat.send','chat.send')}</code></td><td>Send message via WS</td></tr>
        <tr><td><code>${fa('webui','chat.subscribe','chat.subscribe')}</code></td><td>Subscribe to thread updates</td></tr>
        <tr><td><code>${fa('webui','chat.abort','chat.abort')}</code></td><td>Abort current stream</td></tr>
      </table>
      <div class="separator"></div>
      <div class="section-label">Session Lifecycle (state machine)</div>
      <div class="state-row">
        <span class="state-pill s-active">NewSession</span>
        <span class="arrow-label">chat.message</span>
        <span class="state-pill">Streaming</span>
        <span class="arrow-label">chat.update</span>
        <span class="state-pill">Streaming</span>
        <span class="arrow-label">chat.done</span>
        <span class="state-pill s-green">Complete</span>
      </div>
      <div class="desc-text">sessKey = "new-{project}" (temp). On first chat.message, rekeyed to threadKey. threadKeyMap maps threadKey to sessKey.</div>
      <div class="separator"></div>
      <div class="section-label">Reconnect Logic</div>
      <div class="desc-text">Exponential backoff [0, 1s, 2s, 4s] then 30s cap. On open: reset counter, send sync.state, flush queued messages.</div>`
  },

  // ── Column 2: Core Middleware (x: 560) ──
  {
    id: 'router', x: 560, y: 60, w: 440, color: '#4cc9f0',
    title: 'Router', badge: 'core/router.ts', dot: '#4cc9f0',
    html: `
      <div class="section-label">Channel Mapping</div>
      <div class="desc-text">Maps <code>{platform}:{channelId}</code> to project. Registered at startup via <code>setupProject()</code>.</div>
      <table class="info-table">

// Make entry panel draggable
(function() {
  const panel = document.getElementById('entry-panel');
  const header = document.getElementById('entry-panel-header');
  let dragging = false, dx = 0, dy = 0;
  header.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('toggle-btn')) return;
    dragging = true;
    const rect = panel.getBoundingClientRect();
    dx = e.clientX - rect.left;
    dy = e.clientY - rect.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    panel.style.left = (e.clientX - dx) + 'px';
    panel.style.top = (e.clientY - dy) + 'px';
    panel.style.right = 'auto';
  });
  window.addEventListener('mouseup', () => { dragging = false; });
})();

// ============================================================
// FN-ANCHOR POSITION CALCULATION
// ============================================================
function getFnAnchorPosition(fnId) {
  const el = document.querySelector(`.fn-anchor[data-fn="${fnId}"]`);
  if (!el) return null;

  // Get position relative to canvas by walking up the DOM
  const canvasEl = document.getElementById('canvas');
  const canvasRect = canvasEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();

  // Convert screen coordinates to canvas coordinates (compensate for transform)
  const x = (elRect.left + elRect.width / 2 - canvasRect.left) / scale;
  const y = (elRect.top + elRect.height / 2 - canvasRect.top) / scale;

  return { x, y, w: elRect.width / scale, h: elRect.height / scale };
}

// Get the node that contains a fn-anchor
function getNodeForFn(fnId) {
  const parts = fnId.split(':');
  return parts[0];
}

// Find a reasonable connection point on the node edge for a function
function getFnEdgePoint(fnId, side) {
  const pos = getFnAnchorPosition(fnId);
  if (!pos) return null;

  const nodeId = getNodeForFn(fnId);
  const nodeData = NODES.find(n => n.id === nodeId);
  if (!nodeData) return null;

  const nodeEl = nodeElements[nodeId];
  const nh = nodeEl.offsetHeight;

  switch (side) {
    case 'right':
      return { x: nodeData.x + nodeData.w, y: pos.y };
    case 'left':
      return { x: nodeData.x, y: pos.y };
    case 'top':
      return { x: pos.x, y: nodeData.y };
    case 'bottom':
      return { x: pos.x, y: nodeData.y + nh };
    default:
      return pos;
  }
}

// Determine which side of a node a function should connect from/to
function determineSide(fromNodeId, toNodeId) {
  const fromNode = NODES.find(n => n.id === fromNodeId);
  const toNode = NODES.find(n => n.id === toNodeId);
  if (!fromNode || !toNode) return { fromSide: 'right', toSide: 'left' };

  const fromCX = fromNode.x + fromNode.w / 2;
  const toNodeEl = nodeElements[toNode.id];
  const fromNodeEl = nodeElements[fromNode.id];
  const fromCY = fromNode.y + (fromNodeEl ? fromNodeEl.offsetHeight / 2 : 200);
  const toCX = toNode.x + toNode.w / 2;
  const toCY = toNode.y + (toNodeEl ? toNodeEl.offsetHeight / 2 : 200);

  const dx = toCX - fromCX;
  const dy = toCY - fromCY;

  // If same node, use internal routing
  if (fromNodeId === toNodeId) {
    return { fromSide: 'internal', toSide: 'internal' };
  }

  let fromSide, toSide;
  if (Math.abs(dx) > Math.abs(dy)) {
    fromSide = dx > 0 ? 'right' : 'left';
    toSide = dx > 0 ? 'left' : 'right';
  } else {
    fromSide = dy > 0 ? 'bottom' : 'top';
    toSide = dy > 0 ? 'top' : 'bottom';
  }

  return { fromSide, toSide };
}

// ============================================================
// RENDER CONNECTIONS (SVG)
// ============================================================
const svgPathElements = {};

function renderConnections() {
  const svg = document.getElementById('connections');
  let html = `<defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4cc9f0"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fb923c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <filter id="glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  FN_CONNECTIONS.forEach(c => {
    const fromNodeId = getNodeForFn(c.from);
    const toNodeId = getNodeForFn(c.to);
    const { fromSide, toSide } = determineSide(fromNodeId, toNodeId);

    // For same-node connections, draw a small arc
    if (fromSide === 'internal') {
      const p1 = getFnAnchorPosition(c.from);
      const p2 = getFnAnchorPosition(c.to);
      if (!p1 || !p2) return;

      const node = NODES.find(n => n.id === fromNodeId);
      const arcX = node.x + node.w + 30;
      const strokeDash = c.style === 'dashed' ? 'stroke-dasharray="6,4"' : '';
      const markerColor = getMarkerColor(c.color);
      const sw = c.color === '#3f3f46' ? '1' : '1.5';

      html += `<path id="path-${c.id}" data-conn-id="${c.id}" d="M${node.x + node.w},${p1.y} C${arcX},${p1.y} ${arcX},${p2.y} ${node.x + node.w},${p2.y}"
        fill="none" stroke="${c.color}" stroke-width="${sw}" ${strokeDash}
        marker-end="url(#arrow-${markerColor})" opacity="0.7"/>`;

      const mx = arcX - 8;
      const my = (p1.y + p2.y) / 2;
      html += renderLabel(mx, my, c.label, c.color);
      return;
    }

    const p1 = getFnEdgePoint(c.from, fromSide);
    const p2 = getFnEdgePoint(c.to, toSide);

    if (!p1 || !p2) return;

    const dx = Math.abs(p2.x - p1.x);
    const dy = Math.abs(p2.y - p1.y);
    const offset = Math.max(40, Math.min(120, dx * 0.4, dy * 0.4));

    let cp1 = {...p1}, cp2 = {...p2};
    if (fromSide === 'right') cp1.x += offset;
    else if (fromSide === 'left') cp1.x -= offset;
    else if (fromSide === 'top') cp1.y -= offset;
    else if (fromSide === 'bottom') cp1.y += offset;

    if (toSide === 'right') cp2.x += offset;
    else if (toSide === 'left') cp2.x -= offset;
    else if (toSide === 'top') cp2.y -= offset;
    else if (toSide === 'bottom') cp2.y += offset;

    const strokeDash = c.style === 'dashed' ? 'stroke-dasharray="6,4"' : '';
    const markerColor = getMarkerColor(c.color);
    const sw = c.color === '#3f3f46' ? '1' : '1.5';

    html += `<path id="path-${c.id}" data-conn-id="${c.id}" d="M${p1.x},${p1.y} C${cp1.x},${cp1.y} ${cp2.x},${cp2.y} ${p2.x},${p2.y}"
      fill="none" stroke="${c.color}" stroke-width="${sw}" ${strokeDash}
      marker-end="url(#arrow-${markerColor})" opacity="0.7"/>`;

    const mx = (p1.x + p2.x + cp1.x + cp2.x) / 4;
    const my = (p1.y + p2.y + cp1.y + cp2.y) / 4;
    html += renderLabel(mx, my, c.label, c.color);
  });

  // Add animation group container
  html += '<g id="animation-layer"></g>';

  svg.innerHTML = html;
}

function getMarkerColor(color) {
  if (color === '#4cc9f0') return 'cyan';
  if (color === '#3f3f46') return 'dim';
  if (color === '#a78bfa') return 'purple';
  if (color === '#34d399') return 'green';
  if (color === '#fb923c') return 'orange';
  return 'cyan';
}

function renderLabel(mx, my, label, color) {
  const labelW = label.length * 5.5 + 8;
  return `<rect x="${mx - 2}" y="${my - 9}" rx="3" ry="3"
    width="${labelW}" height="14"
    fill="#09090b" fill-opacity="0.85" stroke="${color}" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="${mx + 2}" y="${my + 2}" fill="${color}" font-size="8.5"
    font-family="'JetBrains Mono', monospace" opacity="0.85">${label}</text>`;
}

// Render after layout settles
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    renderConnections();
    updateMinimap();
    fitToScreen();
  });
});

// ============================================================
// CHAIN HIGHLIGHTING
// ============================================================
let activeChain = null;
let animationFrameId = null;
let animSpeed = 1;

function setSpeed(speed, btn) {
  animSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleChain(chainId) {
  if (activeChain === chainId) {
    clearChain();
    return;
  }
  activateChain(chainId);
}

function activateChain(chainId) {
  clearChain();
  activeChain = chainId;
  const chain = CHAINS[chainId];
  if (!chain) return;

  const chainFnSet = new Set(chain.fns);
  const chainConnSet = new Set(chain.connections);

  // Collect nodes that contain chain functions
  const chainNodeIds = new Set();
  chain.fns.forEach(fnId => {
    chainNodeIds.add(getNodeForFn(fnId));
  });

  // Dim all nodes, highlight chain nodes
  Object.entries(nodeElements).forEach(([id, el]) => {
    if (chainNodeIds.has(id)) {
      el.classList.add('chain-node');
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
      el.classList.remove('chain-node');
    }
  });

  // Highlight fn-anchors
  document.querySelectorAll('.fn-anchor').forEach(el => {
    const fnId = el.dataset.fn;
    if (chainFnSet.has(fnId)) {
      el.classList.add('highlighted', 'chain-active');
    }
  });

  // Highlight / dim connection paths
  document.querySelectorAll('#connections path[data-conn-id]').forEach(pathEl => {
    const connId = pathEl.dataset.connId;
    if (chainConnSet.has(connId)) {
      pathEl.classList.add('chain-path');
      pathEl.classList.remove('dimmed');
      pathEl.setAttribute('stroke', '#fbbf24');
      pathEl.setAttribute('stroke-width', '2.5');
      pathEl.setAttribute('opacity', '1');
      pathEl.setAttribute('marker-end', 'url(#arrow-yellow)');
      pathEl.removeAttribute('stroke-dasharray');
    } else {
      pathEl.classList.add('dimmed');
      pathEl.classList.remove('chain-path');
      pathEl.setAttribute('opacity', '0.05');
    }
  });

  // Dim labels (rects and texts that follow paths)
  const svg = document.getElementById('connections');
  const allRects = svg.querySelectorAll('rect');
  const allTexts = svg.querySelectorAll('text');
  // We need to dim non-chain labels. Labels follow their paths in order.
  // Since we rebuild SVG, labels are interleaved with paths.
  // Simple approach: dim all rects/texts, then un-dim ones near chain paths.
  allRects.forEach(r => r.setAttribute('opacity', '0.05'));
  allTexts.forEach(t => t.setAttribute('opacity', '0.05'));

  // Un-dim labels that belong to chain connections
  // Re-traverse the SVG: for each chain path, the next rect+text siblings are its label
  document.querySelectorAll('#connections path[data-conn-id]').forEach(pathEl => {
    const connId = pathEl.dataset.connId;
    if (chainConnSet.has(connId)) {
      let next = pathEl.nextElementSibling;
      if (next && next.tagName === 'rect') {
        next.setAttribute('opacity', '0.85');
        next.setAttribute('stroke', '#fbbf24');
        let textEl = next.nextElementSibling;
        if (textEl && textEl.tagName === 'text') {
          textEl.setAttribute('opacity', '1');
          textEl.setAttribute('fill', '#fbbf24');
        }
      }
    }
  });

  // Update entry panel
  document.querySelectorAll('.entry-item').forEach(item => {
    item.classList.toggle('active', item.dataset.chain === chainId);
  });

  // Start animation
  startChainAnimation(chainId);
}

function clearChain() {
  activeChain = null;
  stopChainAnimation();

  // Remove all dimming/highlighting classes
  Object.values(nodeElements).forEach(el => {
    el.classList.remove('dimmed', 'chain-node');
  });

  document.querySelectorAll('.fn-anchor').forEach(el => {
    el.classList.remove('highlighted', 'chain-active');
  });

  // Re-render connections to restore original state
  renderConnections();

  // Update entry panel
  document.querySelectorAll('.entry-item').forEach(item => {
    item.classList.remove('active');
  });
}

// Escape key clears chain
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && activeChain) {
    clearChain();
  }
});

// ============================================================
// YELLOW LIGHT FLOW ANIMATION
// ============================================================
const TAIL_COUNT = 8;
const TAIL_SPACING = 12;

function startChainAnimation(chainId) {
  stopChainAnimation();
  const chain = CHAINS[chainId];
  if (!chain || chain.connections.length === 0) return;

  const pathEls = chain.connections.map(connId => {
    return document.getElementById('path-' + connId);
  }).filter(Boolean);

  if (pathEls.length === 0) return;

  // Pre-compute total length and cumulative lengths
  const pathLengths = pathEls.map(p => p.getTotalLength());
  const totalLength = pathLengths.reduce((a, b) => a + b, 0);
  const cumulativeLengths = [];
  let cumulative = 0;
  pathLengths.forEach(l => {
    cumulativeLengths.push(cumulative);
    cumulative += l;
  });

  // Create glow dot and tail dots in the animation layer
  const animLayer = document.getElementById('animation-layer');
  if (!animLayer) return;

  // Create tail dots (trailing, decreasing opacity)
  const dots = [];
  for (let i = TAIL_COUNT; i >= 0; i--) {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const opacity = i === 0 ? 1.0 : (1.0 - (i / (TAIL_COUNT + 1))) * 0.6;
    const r = i === 0 ? 6 : Math.max(2, 6 - i * 0.5);
    dot.setAttribute('r', String(r));
    dot.setAttribute('fill', '#fbbf24');
    dot.setAttribute('opacity', String(opacity));
    if (i === 0) {
      dot.setAttribute('filter', 'url(#glow-dot)');
    }
    animLayer.appendChild(dot);
    dots.push({ el: dot, tailOffset: i * TAIL_SPACING });
  }

  let progress = 0;
  const baseSpeed = 2.5; // pixels per frame at 1x

  function getPointAtGlobalLength(len) {
    // Wrap around
    len = ((len % totalLength) + totalLength) % totalLength;
    for (let i = 0; i < pathEls.length; i++) {
      if (len <= cumulativeLengths[i] + pathLengths[i]) {
        const localLen = len - cumulativeLengths[i];
        return pathEls[i].getPointAtLength(localLen);
      }
    }
    return pathEls[pathEls.length - 1].getPointAtLength(pathLengths[pathLengths.length - 1]);
  }

  function step() {
    progress += baseSpeed * animSpeed;
    if (progress > totalLength) {
      progress -= totalLength;
    }

    dots.forEach(({ el, tailOffset }) => {
      const pt = getPointAtGlobalLength(progress - tailOffset);
      el.setAttribute('cx', String(pt.x));
      el.setAttribute('cy', String(pt.y));
    });

    animationFrameId = requestAnimationFrame(step);
  }

  animationFrameId = requestAnimationFrame(step);
}

function stopChainAnimation() {
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  // Remove dots from animation layer
  const animLayer = document.getElementById('animation-layer');
  if (animLayer) {
    animLayer.innerHTML = '';
  }
}

// ============================================================
// PAN & ZOOM
// ============================================================
let scale = 1;
let panX = 0, panY = 0;
let isDragging = false;
let dragStartX, dragStartY, panStartX, panStartY;

const viewport = document.getElementById('viewport');

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
  updateMinimap();
}

function zoomBy(delta, cx, cy) {
  const oldScale = scale;
  scale = Math.max(0.1, Math.min(3, scale + delta));
  if (cx !== undefined && cy !== undefined) {
    panX = cx - (cx - panX) * (scale / oldScale);
    panY = cy - (cy - panY) * (scale / oldScale);
  }
  applyTransform();
  // Re-render connections on zoom since fn positions change relative to canvas
  scheduleConnectionRender();
}

let renderTimeout = null;
function scheduleConnectionRender() {
  if (renderTimeout) clearTimeout(renderTimeout);
  renderTimeout = setTimeout(() => {
    const wasActive = activeChain;
    renderConnections();
    if (wasActive) {
      activateChain(wasActive);
    }
  }, 50);
}

function resetView() {
  scale = 1; panX = 0; panY = 0;
  applyTransform();
  scheduleConnectionRender();
}

function fitToScreen() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  let maxX = 0, maxY = 0;
  NODES.forEach(n => {
    const el = nodeElements[n.id];
    maxX = Math.max(maxX, n.x + n.w + 40);
    maxY = Math.max(maxY, n.y + el.offsetHeight + 40);
  });
  const sx = vw / maxX;
  const sy = vh / maxY;
  scale = Math.min(sx, sy, 1) * 0.95;
  panX = (vw - maxX * scale) / 2;
  panY = (vh - maxY * scale) / 2;
  applyTransform();
  scheduleConnectionRender();
}

// Mouse wheel zoom
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  zoomBy(delta, cx, cy);
}, { passive: false });

// Drag to pan
viewport.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  // Don't start drag if clicking on fn-anchor
  if (e.target.closest('.fn-anchor')) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Touch support
let lastTouchDist = 0;
let lastTouchMid = null;
viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    panStartX = panX; panStartY = panY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    lastTouchMid = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  }
}, { passive: true });
viewport.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = panStartX + (e.touches[0].clientX - dragStartX);
    panY = panStartY + (e.touches[0].clientY - dragStartY);
    applyTransform();
  } else if (e.touches.length === 2) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const mid = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
    if (lastTouchDist > 0) {
      const rect = viewport.getBoundingClientRect();
      const cx = mid.x - rect.left;
      const cy = mid.y - rect.top;
      const delta = (dist - lastTouchDist) * 0.005;
      zoomBy(delta, cx, cy);
    }
    lastTouchDist = dist;
    lastTouchMid = mid;
  }
}, { passive: false });
viewport.addEventListener('touchend', () => {
  isDragging = false;
  lastTouchDist = 0;
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return; // Handled by chain clear
  const step = 60;
  switch(e.key) {
    case '+': case '=': zoomBy(0.15); break;
    case '-': zoomBy(-0.15); break;
    case '0': resetView(); break;
    case 'ArrowUp': panY += step; applyTransform(); break;
    case 'ArrowDown': panY -= step; applyTransform(); break;
    case 'ArrowLeft': panX += step; applyTransform(); break;
    case 'ArrowRight': panX -= step; applyTransform(); break;
  }
});

// ============================================================
// MINI-MAP
// ============================================================
function updateMinimap() {
  const mmCanvas = document.getElementById('minimap-canvas');
  const ctx = mmCanvas.getContext('2d');
  const mmW = 200, mmH = 180;
  mmCanvas.width = mmW; mmCanvas.height = mmH;

  let maxX = 0, maxY = 0;
  NODES.forEach(n => {
    const el = nodeElements[n.id];
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + (el ? el.offsetHeight : 200));
  });
  maxX += 80; maxY += 80;

  const sx = mmW / maxX;
  const sy = mmH / maxY;
  const s = Math.min(sx, sy);

  ctx.clearRect(0, 0, mmW, mmH);

  NODES.forEach(n => {
    const el = nodeElements[n.id];
    const h = el ? el.offsetHeight : 200;
    ctx.fillStyle = n.color + '40';
    ctx.strokeStyle = n.color + '80';
    ctx.lineWidth = 0.5;
    ctx.fillRect(n.x * s, n.y * s, n.w * s, h * s);
    ctx.strokeRect(n.x * s, n.y * s, n.w * s, h * s);
  });

  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const vpEl = document.getElementById('minimap-viewport');
  const vx = (-panX / scale) * s;
  const vy = (-panY / scale) * s;
  const vww = (vw / scale) * s;
  const vhh = (vh / scale) * s;
  vpEl.style.left = vx + 'px';
  vpEl.style.top = vy + 'px';
  vpEl.style.width = Math.min(vww, mmW) + 'px';
  vpEl.style.height = Math.min(vhh, mmH) + 'px';
}

// Resize handler
window.addEventListener('resize', () => {
  updateMinimap();
  scheduleConnectionRender();
});

// ============================================================
// FN-ANCHOR CLICK HANDLER
// ============================================================
document.addEventListener('click', (e) => {
  const anchor = e.target.closest('.fn-anchor');
  if (!anchor) return;

  e.stopPropagation();
  const fnId = anchor.dataset.fn;

  // Find which chains contain this function
  for (const [chainId, chain] of Object.entries(CHAINS)) {
    if (chain.fns.includes(fnId)) {
      toggleChain(chainId);
      return;
    }
  }
});
</script>
