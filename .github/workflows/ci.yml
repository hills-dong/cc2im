name: CI
on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm run build
      - name: Smoke test
        run: |
          cat > /tmp/smoke-config.yaml <<'CONF'
          lark:
            appId: ""
            appSecret: ""
          discord:
            token: ""
          projects: []
          claude:
            command: echo
            defaultArgs: []
            bufferInterval: 500
            timeout: 5000
          formatter:
            maxMessageLength:
              discord: 2000
              lark: 30000
            maxConcurrentProcesses: 5
          CONF
          CC2IM_CONFIG=/tmp/smoke-config.yaml CC2IM_DB=/tmp/smoke.db node packages/cli/dist/cli.js web --port 9999 --bind 127.0.0.1 &
          sleep 3
          curl -f http://127.0.0.1:9999/api/projects
          curl -f http://127.0.0.1:9999/api/config
          curl -f http://127.0.0.1:9999/ | grep -q "<html"
          kill %1
