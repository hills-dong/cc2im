name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install && npm run build
      - name: Copy UI assets for Tauri (Unix)
        if: runner.os != 'Windows'
        run: cp -r packages/ui/dist packages/desktop/dist
      - name: Copy UI assets for Tauri (Windows)
        if: runner.os == 'Windows'
        run: xcopy packages\ui\dist packages\desktop\dist /E /I /Y
        shell: cmd
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "cc2im ${{ github.ref_name }}"
          releaseBody: "Desktop release for cc2im"
